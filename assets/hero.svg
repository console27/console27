<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-labelledby="title desc">
<title id="title">Console27 - Linux systems and cloud infrastructure</title>
<desc id="desc">Premium dark terminal-style profile banner, featuring Console27 and founder of StrenoxCloud.</desc>
